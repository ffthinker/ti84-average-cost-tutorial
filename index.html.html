<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TI-84 Average Cost Interactive Tutorial</title><style>
:root{--navy:#134678;--blue:#286eb4;--pale:#eef6fd;--dark:#1e2226;--screen:#deebdc;--yellow:#ffdd57;--green:#1e7d46}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#161616}.wrap{max-width:1280px;margin:auto;padding:18px}.head{background:var(--navy);color:#fff;padding:18px 24px;border-radius:14px;display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{font-size:30px;margin:0}.status{font-size:20px;font-weight:700}.stage{margin-top:18px;border:2px solid #286eb4;border-radius:18px;padding:24px;min-height:570px;background:#eef6fd}.question{display:flex;flex-direction:column;justify-content:center;min-height:500px;text-align:center}.part{font-size:30px;font-weight:800;color:var(--navy)}.q{font-size:38px;font-weight:800;margin:30px auto;max-width:980px}.goal{font-size:26px;max-width:900px;margin:auto}.calcview{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:start}.calc{background:var(--dark);border-radius:30px;padding:28px;min-height:500px}.screen{background:var(--screen);border:3px solid #000;border-radius:10px;padding:20px;min-height:130px;font:26px/1.35 'Courier New',monospace;white-space:pre-line}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:24px}.key{background:#f5f5f5;border:2px solid #111;border-radius:9px;min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:800}.key.second{background:#286eb4}.key.active{background:var(--yellow);box-shadow:0 0 0 5px rgba(255,221,87,.35)}.instructions{background:#fff;border:2px solid #286eb4;border-radius:18px;padding:28px;min-height:500px}.instructions h2{color:var(--navy);font-size:30px;margin:0 0 22px}.instructions p{font-size:26px;line-height:1.45}.result{margin-top:28px;padding:18px;background:#e4f6ea;border:2px solid var(--green);border-radius:12px;color:var(--green);font-size:24px;font-weight:800;text-align:center}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.btn{font-size:22px;font-weight:800;border:0;border-radius:12px;padding:14px 28px;background:var(--navy);color:#fff;cursor:pointer;min-width:150px}.btn:disabled{opacity:.35;cursor:not-allowed}.count{font-size:18px;color:#555;font-weight:700}@media(max-width:850px){.calcview{grid-template-columns:1fr}.q{font-size:30px}.head{align-items:flex-start;flex-direction:column}.keys{gap:7px}.key{font-size:12px}.stage{padding:14px}}
</style></head><body><main class="wrap"><header class="head"><h1>TI-84 • Average Cost Function</h1><div id="status" class="status"></div></header><section id="stage" class="stage" aria-live="polite"></section><nav class="nav"><button id="back" class="btn">◀ Back</button><div id="count" class="count"></div><button id="next" class="btn">Next ▶</button></nav></main><script>
const states=[
{p:'Setup',t:'Question',q:'Enter the model once in Y₁',g:'C̄(x) = 0.56x² − 34.39x + 1212.57 + 20,000/x'},
{p:'Setup',t:'Step 1',title:'Open the function editor',ins:'Press Y=. Enter .56X² − 34.39X + 1212.57 + 20000 ÷ X. Use the X,T,θ,n key each time you need x.',screen:'Y1=.56X²−34.39X+1212.57\n   +20000/X',hi:['Y=','X,T,θ,n']},
{p:'(a)',t:'Question',q:'Evaluate C̄(30).',g:'Find the average cost when 30 computers are produced.'},
{p:'(a)',t:'Step 1 of 3',title:'Recall Y₁',ins:'Press VARS → Y-VARS → 1:Function → 1:Y1.',screen:'Y1',hi:['VARS']},
{p:'(a)',t:'Step 2 of 3',title:'Enter the input',ins:'Type (30), then press ENTER.',screen:'Y1(30)',hi:['3','0','ENTER']},
{p:'(a)',t:'Step 3 of 3',title:'Read the result',ins:'The calculator evaluates the stored average-cost function at x = 30.',screen:'Y1(30)\n1351.54',result:'C̄(30) ≈ $1,351.54 per computer'},
{p:'(b)',t:'Question',q:'Evaluate C̄(40).',g:'Find the average cost when 40 computers are produced.'},
{p:'(b)',t:'Step 1 of 2',title:'Enter the input',ins:'Recall Y1, type (40), then press ENTER.',screen:'Y1(40)',hi:['4','0','ENTER']},
{p:'(b)',t:'Step 2 of 2',title:'Read the result',ins:'Read the displayed value and include the correct units.',screen:'Y1(40)\n1232.97',result:'C̄(40) = $1,232.97 per computer'},
{p:'(c)',t:'Question',q:'Evaluate C̄(50).',g:'Find the average cost when 50 computers are produced.'},
{p:'(c)',t:'Step 1 of 2',title:'Enter the input',ins:'Recall Y1, type (50), then press ENTER.',screen:'Y1(50)',hi:['5','0','ENTER']},
{p:'(c)',t:'Step 2 of 2',title:'Read the result',ins:'Read the displayed value and include the correct units.',screen:'Y1(50)\n1293.07',result:'C̄(50) = $1,293.07 per computer'},
{p:'(d)',t:'Question',q:'Graph the average-cost function for 0 < x ≤ 80.',g:'Choose a viewing window that clearly shows the behavior of the model.'},
{p:'(d)',t:'Step 1 of 2',title:'Set the window',ins:'Press WINDOW. Set Xmin = 0, Xmax = 80, Ymin = 1200, and Ymax = 1700.',screen:'Xmin=0   Xmax=80\nYmin=1200 Ymax=1700',hi:['WINDOW']},
{p:'(d)',t:'Step 2 of 2',title:'Display the graph',ins:'Press GRAPH. Observe that the graph decreases, reaches a low point, and then increases.',screen:'      \\____/\n        •\n      x≈41',hi:['GRAPH'],result:'The minimum is near x = 41.'},
{p:'(e)',t:'Question',q:'Use a table to estimate the minimum average cost.',g:'Identify the number of computers that gives the smallest average cost.'},
{p:'(e)',t:'Step 1 of 3',title:'Set up the table',ins:'Press 2nd, then WINDOW (TBLSET). Set TblStart = 1 and ΔTbl = 1.',screen:'TblStart=1\nΔTbl=1',hi:['2nd','WINDOW']},
{p:'(e)',t:'Step 2 of 3',title:'Open TABLE',ins:'Press 2nd, then GRAPH (TABLE). Scroll until the Y1 values stop decreasing and begin increasing.',screen:'X     Y1\n40  1232.97\n41  1231.74\n42  1233.05',hi:['2nd','GRAPH']},
{p:'(e)',t:'Step 3 of 3',title:'Identify the minimum',ins:'Compare the nearby table values. The smallest displayed average cost occurs at x = 41.',screen:'40  1232.97\n41  1231.74  ← min\n42  1233.05',result:'C̄(41) ≈ $1,231.74 per computer'}];
const labels=['Y=','WINDOW','ZOOM','TRACE','GRAPH','2nd','MODE','DEL','X,T,θ,n','STAT','MATH','APPS','PRGM','VARS','CLEAR','7','8','9','÷','4','5','6','×','1','2','3','+','0','.','ENTER'];let i=0;const stage=document.getElementById('stage'),status=document.getElementById('status'),count=document.getElementById('count'),back=document.getElementById('back'),next=document.getElementById('next');
function render(){const s=states[i];status.textContent=`${s.p} • ${s.t}`;count.textContent=`${i+1} / ${states.length}`;back.disabled=i===0;next.disabled=i===states.length-1;if(s.q){stage.innerHTML=`<div class="question"><div class="part">${s.p}</div><div class="q">${s.q}</div><div class="goal">${s.g}</div></div>`;return;}const keys=labels.map(k=>`<div class="key ${k==='2nd'?'second':''} ${(s.hi||[]).includes(k)?'active':''}">${k}</div>`).join('');stage.innerHTML=`<div class="calcview"><div class="calc"><div class="screen">${s.screen}</div><div class="keys">${keys}</div></div><div class="instructions"><h2>${s.title}</h2><p>${s.ins}</p>${s.result?`<div class="result">${s.result}</div>`:''}</div></div>`;}back.addEventListener('click',()=>{if(i>0){i--;render()}});next.addEventListener('click',()=>{if(i<states.length-1){i++;render()}});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&i<states.length-1){i++;render()}if(e.key==='ArrowLeft'&&i>0){i--;render()}});render();
</script></body></html>
